services:
  db:
    image: timescale/timescaledb:2.31.0-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql
      - ./schemas/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d exchangesim_marketdata"]
      interval: 5s
      timeout: 3s
      retries: 10

  feedhandler:
    build:
      context: ./mdp
      target: feedhandler
      additional_contexts:
        proto: ./schemas/proto
    depends_on:
      db:
        condition: service_healthy

  backend:
    profiles: ["app"]
    build: ./backend
    environment:
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASS}
      LEDGER_DB_URL: jdbc:postgresql://db:5432/exchangesim_ledger
      MARKETDATA_DB_URL: jdbc:postgresql://db:5432/exchangesim_marketdata
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data: